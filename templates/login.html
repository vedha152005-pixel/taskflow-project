
<!DOCTYPE html>
<html>
<head>
    <title>Login - TaskFlow</title>
          <link rel="stylesheet"
      href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back 👋</h1>
            <p class="subtitle">Login to manage your tasks</p>


            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}

                    {% for category, message in messages %}

                        <div class="message {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}
            {% endwith %}


            <form method="POST">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="bottom-text">
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</body>
</html>
