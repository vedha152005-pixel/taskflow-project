<!DOCTYPE html>
<html>
<head>
    <title>Edit Task - TaskFlow</title>
</head>

<body>

    <h1>Edit Task</h1>

    <form method="POST">

        <label>Task Title:</label><br>
        <input
            type="text"
            name="title"
            value="{{ task.title }}"
            required
        >

        <br><br>

        <label>Description:</label><br>
        <textarea name="description" required>{{ task.description }}</textarea>

        <br><br>

        <label>Category:</label><br>
        <input
            type="text"
            name="category"
            value="{{ task.category }}"
            required
        >

        <br><br>

        <label>Priority:</label><br>

        <select name="priority" required>

            <option value="Low"
                {% if task.priority == "Low" %}selected{% endif %}>
                Low
            </option>

            <option value="Medium"
                {% if task.priority == "Medium" %}selected{% endif %}>
                Medium
            </option>

            <option value="High"
                {% if task.priority == "High" %}selected{% endif %}>
                High
            </option>

        </select>

        <br><br>

        <label>Due Date:</label><br>
        <input
            type="date"
            name="due_date"
            value="{{ task.due_date }}"
            required
        >

        <br><br>

        <button type="submit">Update Task</button>

    </form>

    <br>

    <a href="{{ url_for('dashboard') }}">
        Back to Dashboard
    </a>

</body>
</html>
